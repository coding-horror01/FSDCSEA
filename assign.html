<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Image Generator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: aquamarine;
        }

        #imageContainer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }

        .image-item {
            margin: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        img {
            width: 150px;
            height: auto;
        }

        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        input[type="number"] {
            padding: 5px;
            width: 100px;
        }
    </style>
</head>
<body>
    <h1>Dynamic Image Generator</h1>

    <div class="controls">
        <input type="number" id="imageCount" placeholder="Number of images" min="1">
        <button id="generateImages">Generate</button>
    </div>

    <div id="imageContainer"></div>

    <script>
        // Function to create an image item with a checkbox
        const createImageItem = (index) => {
            const imageItem = document.createElement('div');
            imageItem.className = 'image-item';

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';

            const img = document.createElement('img');
            img.src = "https://pics.clipartpng.com/Light_Bulb_PNG_Clip_Art-2102.png";
            img.alt = `Image ${index + 1}`;

            checkbox.addEventListener('change', () => {
                img.src = checkbox.checked ? "https://pics.clipartpng.com/midle/Yellow_Light_Bulb_PNG_Clip_Art-2108.png" : "https://pics.clipartpng.com/Light_Bulb_PNG_Clip_Art-2102.png";
            });

            imageItem.appendChild(checkbox);
            imageItem.appendChild(img);

            return imageItem;
        };

        // Event listener for generating images
        document.getElementById('generateImages').addEventListener('click', () => {
            const count = parseInt(document.getElementById('imageCount').value);
            const container = document.getElementById('imageContainer');

            // Clear container for new images
            container.innerHTML = '';

            // Generate image items
            for (let i = 0; i < count; i++) {
                container.appendChild(createImageItem(i));
            }
        });
    </script>
</body>
</html>
